<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140f24">
<meta name="description" content="SlimeMania - pop giant slimes with 30 ridiculous weapons. A satisfying pixel shooter for phone and desktop.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SlimeMania</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="backdrop" width="0" height="0"></canvas>
<div id="game">
  <canvas id="screen" width="216" height="384"></canvas>

  <div id="hud" class="hidden">
    <div id="money" class="pill"><i class="coin"></i><span id="moneyVal">0</span></div>
    <div id="levelBox">
      <button id="lvPrev" class="arrow" aria-label="Previous level"><i class="tri left"></i></button>
      <div id="lvLabel"><div id="lvText">LEVEL 1</div><div id="waveText">WAVE 1</div></div>
      <button id="lvNext" class="arrow" aria-label="Next level"><i class="tri right"></i></button>
    </div>
    <div id="hudRight">
      <button id="btnShop" class="btn shopBtn" aria-label="Shop"><i class="px" data-icon="cart"></i></button>
    </div>
  </div>

  <div id="gain"></div>
  <div id="banner"><div class="b-main"></div><div class="b-sub"></div></div>
  <div id="hint" class="hidden">&lt; DRAG TO MOVE &gt;</div>

  <div id="shop" class="hidden">
    <div class="shop-panel">
      <div class="shop-head">
        <div class="shop-title">ARMORY</div>
        <div class="shop-money pill"><i class="coin"></i><span id="shopMoney">0</span></div>
      </div>
      <div class="shop-sub"><span>EQUIPPED <b id="eqCount">1/3</b></span><span>TOTAL DPS <b id="totalDps">0</b></span></div>
      <div class="slots" id="slots"></div>
      <div class="shop-list" id="shopList"></div>
      <div class="shop-foot">
        <div class="shop-hint">TAP A WEAPON TO EQUIP · HOLD ▲ FOR TURBO</div>
        <div class="shop-btns">
          <button id="btnSettings" class="btn big icon" aria-label="Settings"><i class="px" data-icon="gear"></i></button>
          <button id="btnFull" class="btn big icon" aria-label="Fullscreen"><i class="px" data-icon="full"></i></button>
          <button id="shopClose" class="btn big close" aria-label="Close"><i class="px" data-icon="cross"></i>CLOSE</button>
        </div>
      </div>
    </div>
    <div id="settings" class="hidden">
      <div class="confirm-box settings-box">
        <div class="c-title">SETTINGS</div>
        <div class="set-row"><span>SOUND</span><div class="seg"><button data-sound="on">ON</button><button data-sound="off">OFF</button></div></div>
        <div class="set-row"><span>SKY</span><div class="seg"><button data-sky="auto">AUTO</button><button data-sky="day">DAY</button><button data-sky="night">NIGHT</button></div></div>
        <div class="set-row center"><button id="btnReset" class="btn danger">RESET GAME</button></div>
        <div class="set-row center"><button id="settingsClose" class="btn big">BACK</button></div>
      </div>
    </div>
    <div id="confirm" class="hidden">
      <div class="confirm-box">
        <div class="c-title">RESET GAME?</div>
        <div class="c-text">ALL MONEY, WEAPONS AND LEVELS ARE LOST. THE GAME STARTS FROM THE BEGINNING.</div>
        <div class="c-btns"><button id="confirmNo" class="btn">KEEP</button><button id="confirmYes" class="btn danger">RESET</button></div>
      </div>
    </div>
  </div>

  <div id="title">
    <div class="logo" aria-label="SlimeMania">
      <span style="--c:#ff3a7c">S</span><span style="--c:#ff8c1a">L</span><span style="--c:#ffe23a">I</span><span style="--c:#7dff3a">M</span><span style="--c:#3ad7ff">E</span>
      <br>
      <span style="--c:#c04dff">M</span><span style="--c:#ff3a7c">A</span><span style="--c:#ff8c1a">N</span><span style="--c:#ffe23a">I</span><span style="--c:#3ad7ff">A</span>
    </div>
    <div class="tap" id="tapText">TAP TO PLAY</div>
    <div class="credits">30 WEAPONS · ENDLESS LEVELS · PURE POP</div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
